<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Women's Day 20/10 💗</title>

<!-- External CSS Libraries -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600&family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/css/bootstrap-grid.min.css" integrity="sha512-JQksK36WdRekVrvdxNyV3B0Q1huqbTkIQNbz1dlcFVgNynEMRl0F8OSqOGdVppLUDIvsOejhr/W5L3G/b3J+8w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- Canvas Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Quicksand', sans-serif;
  }

  /* Nút điều khiển âm thanh góc màn hình (Đã đẩy xuống thấp hơn một chút để không vướng nút X của thư) */
  #audio-control {
    position: fixed;
    top: 75px;
    right: 20px;
    z-index: 999;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(8px);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease;
  }
  #audio-control:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: scale(1.1);
  }

  /* Layer chuyển cảnh chung */
  .step-screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  .step-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* ==========================================
     BUỚC 1 & 2: INTRO GIỮ TRÁI TIM & HYPERSPACE
     ========================================== */
  #bg-canvas-3d {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  :root {
    --start-panel: rgba(40, 5, 30, 0.68);
    --start-stroke: rgba(255, 255, 255, 0.28);
  }

  #start-overlay {
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(70% 55% at 15% 100%, rgba(255, 105, 180, 0.25), transparent 68%),
                radial-gradient(60% 45% at 90% 10%, rgba(255, 130, 185, 0.28), transparent 70%),
                radial-gradient(120% 100% at 50% 50%, rgba(80, 0, 50, 0.85), rgba(20, 0, 15, 0.98));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  #start-card {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #fff;
    width: min(90vw, 480px);
    padding: clamp(28px, 5vw, 42px);
    border: 1px solid var(--start-stroke);
    border-radius: 32px;
    background: var(--start-panel);
    box-shadow: 0 20px 80px rgba(0,0,0,0.4), inset 0 1px rgba(255,255,255,0.15);
  }

  #start-card h1 {
    margin: 0;
    color: #fff0f8;
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 600;
    letter-spacing: .04em;
    font-family: 'Dancing Script', cursive;
    text-shadow: 0 0 22px rgba(255,105,180,0.6);
  }

  #heart-hold-container {
    position: relative;
    width: clamp(140px, 25vw, 180px);
    height: clamp(140px, 25vw, 180px);
    margin: 25px auto;
    cursor: pointer;
    touch-action: manipulation;
  }

  .heart-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 12px rgba(255,105,180,0.4));
    transition: transform .3s cubic-bezier(.175,.885,.32,1.275);
  }

  #heart-hold-container:active .heart-svg {
    transform: scale(0.95);
  }

  .heart-bg {
    fill: rgba(255,255,255,0.05);
    stroke: rgba(255,255,255,0.25);
    stroke-width: 1.5;
  }

  .heart-fill {
    fill: rgba(255,50,120,0);
    stroke: #ff3366;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    transition: stroke-dashoffset .1s linear, fill .3s ease;
  }

  .heart-icon-inside {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(32px, 6vw, 48px);
    opacity: 0.3;
    transition: all .3s ease;
    pointer-events: none;
  }

  #hold-instruction {
    font-size: 13px;
    letter-spacing: .25em;
    color: rgba(255,220,240,0.8);
    font-weight: 600;
    animation: textPulse 1.5s infinite alternate;
  }

  @keyframes textPulse {
    from { opacity: .5; text-shadow: 0 0 5px rgba(255,105,180,0); }
    to { opacity: 1; color: #ff85c2; text-shadow: 0 0 10px rgba(255,105,180,0.8); }
  }

  .heart-runner {
    position: absolute;
    font-size: 16px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    transform: translate(-50%,-50%) scale(.001);
    transition: opacity .2s ease, transform .2s ease;
  }

  #heart-hold-container:active .heart-runner {
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
    filter: drop-shadow(0 0 6px #ff3366);
  }

  /* ==========================================
     BƯỚC 3: MÀN HÌNH KHÓA MẬT MÃ HỒNG PASTEL
     ========================================== */
  #passcode-screen {
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #ffeef2 0%, #ffc0d3 50%, #f7a3bc 100%);
    opacity: 0;
    visibility: hidden;
  }

  #passcode-screen.active {
    opacity: 1;
    visibility: visible;
  }

  #bg-canvas-2d {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .passcode-card {
    position: relative;
    z-index: 10;
    width: min(92vw, 420px);
    padding: 32px 24px;
    border-radius: 36px;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 20px 45px rgba(224, 112, 148, 0.22), inset 0 2px 6px rgba(255, 255, 255, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }

  .avatar-wrapper {
    position: relative;
    margin-bottom: 14px;
  }

  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #ffb3c6 0%, #ff85a1 100%);
    border: 4px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 8px 22px rgba(235, 90, 130, 0.3);
    font-size: 42px;
  }

  .avatar-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    background: #ffffff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }

  .passcode-card h2 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(28px, 6vw, 36px);
    color: #d83a56;
    text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
    margin-bottom: 20px;
    text-align: center;
    font-weight: 700;
  }

  .display-box {
    width: 100%;
    height: 58px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.75);
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    box-shadow: inset 0 2px 6px rgba(216, 58, 86, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 22px;
  }

  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffc2d1;
    border: 2px solid #fff;
    transition: all 0.25s ease;
    transform: scale(0.85);
    opacity: 0.5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: transparent;
  }

  .dot.active {
    background: #ff6584;
    transform: scale(1.25);
    opacity: 1;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 101, 132, 0.7);
  }

  .keypad {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }

  .btn-key {
    height: 58px;
    border: none;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.8);
    color: #d83a56;
    font-family: 'Quicksand', sans-serif;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(220, 110, 140, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.85);
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-key:active, .btn-key.pressed {
    transform: translateY(2px) scale(0.95);
    background: #ffd6e0;
  }

  .btn-key.action-btn {
    font-size: 16px;
    color: #b54a6b;
    background: rgba(255, 230, 238, 0.85);
  }

  .passcode-message {
    min-height: 24px;
    font-size: 14px;
    font-weight: 700;
    color: #d83a56;
    text-align: center;
  }

  .shake {
    animation: shakeAnim 0.45s ease-in-out;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }

  /* ==========================================
     BƯỚC 4: THIỆP HOA HỒNG & LỜI CHÚC
     ========================================== */
  #card-screen {
    z-index: 30;
    background-color: #fae1dd;
    opacity: 0;
    visibility: hidden;
  }

  #card-screen.active {
    opacity: 1;
    visibility: visible;
  }

  .rose-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  .rose-container svg.rose-main-svg {
    width: 80%;
    max-width: 500px;
    display: block;
    position: absolute;
    margin: auto;
    inset: 0;
    z-index: 1;
  }

  #text-click {
    position: absolute;
    z-index: 2;
    font-family: 'Dancing Script', cursive;
    color: #d83a56;
    font-size: clamp(28px, 6vw, 46px);
    top: 80%;
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    animation: bounce 2s infinite;
  }

  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-15px); }
    60% { transform: translateY(-7px); }
  }

  #castle {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    background-color: #fae1dd;
  }

  .letter {
    position: relative;
    z-index: 1;
  }

  .valentines {
    position: relative;
    top: 30px;
    cursor: pointer;
    animation: floatEnvelope 3s linear infinite;
  }

  @keyframes floatEnvelope {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }

  .envelope {
    position: relative;
    width: 300px;
    height: 200px;
    background-color: #f08080;
  }

  .envelope:before {
    background-color: #f08080;
    content: "";
    position: absolute;
    width: 212px;
    height: 212px;
    transform: rotate(45deg);
    top: -105px;
    left: 44px;
    border-radius: 30px 0 0 0;
  }

  .card-inner {
    position: absolute;
    background-color: #eae2b7;
    width: 270px;
    height: 170px;
    top: 5px;
    left: 15px;
    box-shadow: -5px -5px 100px rgba(0, 0, 0, 0.4);
    cursor: pointer;
  }

  .card-inner:before {
    content: "";
    position: absolute;
    border: 3px solid #003049;
    border-style: dotted;
    width: 240px;
    height: 140px;
    left: 12px;
    top: 12px;
  }

  .text-title {
    position: absolute;
    font-family: 'Brush Script MT', cursive;
    font-size: 28px;
    text-align: center;
    line-height: 25px;
    top: 19px;
    left: 85px;
    color: #003049;
  }

  .heart-main {
    background-color: #d62828;
    display: inline-block;
    height: 30px;
    margin: 0 10px;
    position: relative;
    top: 110px;
    left: 105px;
    transform: rotate(-45deg);
    width: 30px;
  }

  .heart-main:before, .heart-main:after {
    content: "";
    background-color: #d62828;
    border-radius: 50%;
    height: 30px;
    position: absolute;
    width: 30px;
  }

  .heart-main:before { top: -15px; left: 0; }
  .heart-main:after { left: 15px; top: 0; }

  .hearts-float { position: absolute; top: 0; }

  .hearts-float div {
    background-color: red;
    display: inline-block;
    height: 10px;
    width: 10px;
    margin: 0 10px;
    position: relative;
    transform: rotate(-45deg);
    top: 50px;
  }

  .hearts-float div:before, .hearts-float div:after {
    content: "";
    background-color: red;
    border-radius: 50%;
    height: 10px;
    position: absolute;
    width: 10px;
  }

  .hearts-float div:before { top: -5px; left: 0; }
  .hearts-float div:after { left: 5px; top: 0; }

  .one { left: 10px; animation: floatUp 1s ease-out infinite; }
  .two { left: 30px; animation: floatUp 2s ease-out infinite; }
  .three { left: 50px; animation: floatUp 1.5s ease-out infinite; }
  .four { left: 70px; animation: floatUp 2.3s ease-out infinite; }
  .five { left: 90px; animation: floatUp 1.7s ease-out infinite; }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(-45deg) scale(0.3); opacity: 1; }
    100% { transform: translateY(-150px) rotate(-45deg) scale(1.3); opacity: 0.5; }
  }

  .front-flap {
    position: absolute;
    border-right: 180px solid #f4978e;
    border-top: 95px solid transparent;
    border-bottom: 100px solid transparent;
    left: 120px;
    top: 5px;
    width: 0;
    height: 0;
    z-index: 10;
    pointer-events: none;
  }

  .front-flap:before {
    position: absolute;
    content: "";
    border-left: 300px solid #f8ad9d;
    border-top: 195px solid transparent;
    left: -120px;
    top: -95px;
    width: 0;
    height: 0;
  }

  .shadow-envelope {
    position: absolute;
    width: 330px;
    height: 25px;
    border-radius: 50%;
    background-color: rgba(0, 0, 0, 0.3);
    top: 265px;
    left: -15px;
    animation: shadowScale 3s linear infinite;
    z-index: -1;
  }

  @keyframes shadowScale {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(0.85); }
  }

  /* Form thư mở ra */
  .wrapperLetterForm {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    backdrop-filter: blur(5px);
  }

  .boxLetter {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 15px;
  }

  .formLetter {
    position: relative;
    width: min(94vw, 680px);
    height: 410px;
    background-color: #FFEBEB;
    border-radius: 22px;
    z-index: 100;
    padding: 24px 18px;
    box-shadow: rgba(0, 0, 0, 0.3) 0px 10px 25px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .wrapperLetter {
    position: relative;
    width: 100%;
    height: 100%;
    border: 2px dashed #FF6666;
    border-radius: inherit;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .boxLetter .before {
    position: absolute;
    width: min(94vw, 680px);
    height: 410px;
    background: #fff;
    transform: rotate(-6deg);
    border-radius: 22px;
    z-index: 10;
  }

  .textLetter {
    width: 100%;
    flex: 1;
    flex-direction: column;
    justify-content: center;
    display: flex;
    align-items: center;
    user-select: none;
    padding: 10px;
    z-index: 12;
  }

  .textLetter h2 {
    font-size: 34px;
    font-family: 'Dancing Script', cursive;
    color: #d83a56;
    margin-bottom: 10px;
  }

  .textLetter .contentLetter {
    font-size: 19px;
    text-align: center;
    padding: 0px 15px;
    font-family: 'Dancing Script', cursive;
    color: #333;
    line-height: 1.45;
  }

  /* Dòng chữ credit nhỏ góc dưới bên phải */
  .letter-credit {
    width: 100%;
    text-align: right;
    font-size: 13px;
    font-family: 'Quicksand', sans-serif;
    color: #b54a6b;
    font-weight: 600;
    padding-right: 12px;
    padding-bottom: 8px;
    z-index: 12;
    letter-spacing: 0.5px;
  }

  .fa-xmark {
    position: absolute;
    right: 25px;
    top: 25px;
    color: #fff;
    cursor: pointer;
    font-size: 30px;
    z-index: 1001;
  }

  svg.rose-svg text {
    fill: #e6668a;
    font-family: 'Quicksand', sans-serif;
    font-size: 9px;
  }
</style>
</head>
<body>

<!-- THẺ AUDIO ĐẶT CHUNG THƯ MỤC -->
  <audio id="bg-music" loop preload="auto">
    <source src="Nhac.mp3" type="audio/mpeg">
    Trình duyệt của bạn không hỗ trợ thẻ audio.
  </audio>

  <!-- Nút Bật/Tắt Nhạc Nhanh -->
  <div id="audio-control" title="Bật/Tắt nhạc">
    <i class="fa-solid fa-music" id="audio-icon"></i>
  </div>

  <!-- CANVAS VŨ TRỤ 3D HYPERSPACE -->
  <canvas id="bg-canvas-3d"></canvas>

  <!-- ==========================================
       BUỚC 1: INTRO GIỮ TRÁI TIM
       ========================================== -->
  <div class="step-screen" id="start-overlay">
    <div id="start-card">
      <h1>Happy Women's Day</h1>
      <div id="heart-hold-container">
        <svg class="heart-svg" viewBox="0 0 32 32">
          <path class="heart-bg" d="M16,28.22 C16,28.22 3,20.04 3,11.5 C3,6.36 7.18,3.5 11.5,3.5 C14.34,3.5 15.34,5.18 16,6.17 C16,6.17 16.66,3.5 20.5,3.5 C24.82,3.5 29,6.36 29,11.5 C29,20.04 16,28.22 16,28.22 Z"></path>
          <path class="heart-fill" d="M16,28.22 C16,28.22 3,20.04 3,11.5 C3,6.36 7.18,3.5 11.5,3.5 C14.34,3.5 15.34,5.18 16,6.17 C16,6.17 16.66,3.5 20.5,3.5 C24.82,3.5 29,6.36 29,11.5 C29,20.04 16,28.22 16,28.22 Z"></path>
        </svg>
        <div class="heart-icon-inside">❤️</div>
        <div class="heart-runner">❤️</div>
      </div>
      <p id="hold-instruction">NHẤN GIỮ TRÁI TIM</p>
    </div>
  </div>

  <!-- ==========================================
       BƯỚC 3: MÀN KHÓA MẬT MÃ HỒNG PASTEL
       ========================================== -->
  <div class="step-screen" id="passcode-screen">
    <canvas id="bg-canvas-2d"></canvas>
    <main class="passcode-card" id="passcode-card">
      <div class="avatar-wrapper">
        <div class="avatar">💗</div>
        <div class="avatar-badge">✨</div>
      </div>
      
      <h2>Mật mã yêu thương</h2>
      
      <div class="display-box">
        <span class="dot">♥</span>
        <span class="dot">♥</span>
        <span class="dot">♥</span>
        <span class="dot">♥</span>
      </div>

  <!-- MODULE VŨ TRỤ 3D THREE.JS -->
  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.136.0';

    const canvas = document.getElementById('bg-canvas-3d');
    const startOverlay = document.getElementById('start-overlay');
    const passcodeScreen = document.getElementById('passcode-screen');
    const heartContainer = document.getElementById('heart-hold-container');
    const heartFill = document.querySelector('.heart-fill');
    const heartIcon = document.querySelector('.heart-icon-inside');
    const holdInstruction = document.getElementById('hold-instruction');
    const heartRunner = document.querySelector('.heart-runner');
    
    const bgMusic = document.getElementById('bg-music');
    const audioControl = document.getElementById('audio-control');
    const audioIcon = document.getElementById('audio-icon');

    function playBackgroundMusic() {
      if (bgMusic && bgMusic.paused) {
        bgMusic.play().then(() => {
          if(audioIcon) audioIcon.className = "fa-solid fa-music";
        }).catch(err => {
          console.log("Phát nhạc bị chặn hoặc thiếu file:", err);
        });
      }
    }

    if(audioControl) {
      audioControl.addEventListener('click', () => {
        if (bgMusic.paused) {
          bgMusic.play();
          audioIcon.className = "fa-solid fa-music";
        } else {
          bgMusic.pause();
          audioIcon.className = "fa-solid fa-volume-xmark";
        }
      });
    }

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.018);
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(40, 25, 50);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    let hyperspaceGroup = new THREE.Group();
    camera.add(hyperspaceGroup);
    let hyperspaceRings = [];
    let hyperspaceSpeed = 0.18;

    const spriteCanvas = document.createElement('canvas');
    spriteCanvas.width = 64; spriteCanvas.height = 64;
    const sctx = spriteCanvas.getContext('2d');
    const glow = sctx.createRadialGradient(32,32,0,32,32,31);
    glow.addColorStop(0,'rgba(255,255,255,1)');
    glow.addColorStop(0.35,'rgba(255,255,255,0.9)');
    glow.addColorStop(0.7,'rgba(255,255,255,0.25)');
    glow.addColorStop(1,'rgba(255,255,255,0)');
    sctx.fillStyle = glow; sctx.fillRect(0,0,64,64);
    const sprite = new THREE.CanvasTexture(spriteCanvas);

    const tube = 2.5;
    const ringGeometry = new THREE.TorusGeometry(10, tube, 3, 6, Math.PI * 2);
    const ringColors = [0xff69b4, 0xff85c2, 0xffadd4];
    let accRotation = 0;
    for (let i=0; i<58*3; i++) {
      const mat = new THREE.PointsMaterial({
        size:0.38+Math.random()*0.38, sizeAttenuation:true, map:sprite,
        alphaTest:0.04, transparent:true, opacity:0, color:ringColors[i%3],
        blending:THREE.AdditiveBlending, depthWrite:false
      });
      const ring = new THREE.Points(ringGeometry, mat);
      ring.position.z = -10 - Math.floor(i/3)*tube*2;
      ring.rotation.z = accRotation + (Math.PI*2/18)*(i%3);
      ring.scale.setScalar(0.78+Math.random()*0.34);
      ring.frustumCulled = false;
      if (i%3===2) accRotation = Math.PI*2*Math.random();
      hyperspaceRings.push(ring);
      hyperspaceGroup.add(ring);
    }
    hyperspaceGroup.visible = false;

    let experienceStarted = false;
    let experienceStartMs = 0;
    let finished = false;
    let progress = 0;
    let holdTimer = null;
    const duration = 2500;
    const intervalTime = 20;
    const step = intervalTime / duration * 100;

    function updateRunnerPosition() {
      if (!heartFill || !heartRunner) return;
      const totalLength = heartFill.getTotalLength();
      const currentLength = progress / 100 * totalLength;
      const point = heartFill.getPointAtLength(currentLength);
      const rect = heartContainer.getBoundingClientRect();
      heartRunner.style.left = (point.x / 32 * rect.width) + 'px';
      heartRunner.style.top = (point.y / 32 * rect.height) + 'px';
    }

    function startHolding(e) {
      if (e) e.preventDefault();
      if (experienceStarted || finished) return;
      
      playBackgroundMusic();

      clearInterval(holdTimer);
      holdInstruction.textContent = 'ĐANG SẠC NĂNG LƯỢNG...';
      updateRunnerPosition();

      holdTimer = setInterval(() => {
        if (progress < 100) {
          progress += step;
          if (progress > 100) progress = 100;
          heartFill.style.strokeDashoffset = 100-progress;
          heartIcon.style.opacity = 0.3+(progress/100)*0.7;
          heartIcon.style.transform = `scale(${1+(progress/100)*0.3})`;
          heartFill.style.fill = `rgba(255, 50, 120, ${(progress/100)*0.4})`;
          updateRunnerPosition();
        }
        if (progress >= 100) {
          clearInterval(holdTimer);
          finished = true;
          holdInstruction.textContent = 'XUẤT PHÁT! 💕';
          setTimeout(startExperience, 200);
        }
      }, intervalTime);
    }

    function stopHolding() {
      if (experienceStarted || finished) return;
      clearInterval(holdTimer);
      holdTimer = setInterval(() => {
        if (progress > 0) {
          progress -= 4;
          if (progress < 0) progress = 0;
          heartFill.style.strokeDashoffset = 100-progress;
          heartIcon.style.opacity = 0.3+(progress/100)*0.7;
          heartIcon.style.transform = `scale(${1+(progress/100)*0.3})`;
          heartFill.style.fill = `rgba(255, 50, 120, ${(progress/100)*0.4})`;
          holdInstruction.textContent = 'NHẤN GIỮ TRÁI TIM';
          updateRunnerPosition();
        } else clearInterval(holdTimer);
      }, intervalTime);
    }

    function startExperience() {
      if (experienceStarted) return;
      experienceStarted = true;
      experienceStartMs = performance.now();
      startOverlay.classList.add('hidden');
      hyperspaceGroup.visible = true;
    }

    heartContainer.addEventListener('mousedown', startHolding);
    document.addEventListener('mouseup', stopHolding);
    heartContainer.addEventListener('touchstart', startHolding, {passive:false});
    document.addEventListener('touchend', stopHolding);
    document.addEventListener('touchcancel', stopHolding);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    const easeOutCubic = x => 1-Math.pow(1-x,3);
    const smoothstep = (a,b,x) => {
      const t=Math.min(1,Math.max(0,(x-a)/(b-a)));
      return t*t*(3-2*t);
    };

    let passcodeTriggered = false;

    function tick() {
      const t = experienceStarted ? (performance.now()-experienceStartMs)/1000 : 0;
      if (experienceStarted) {
        if (t<9) {
          const p=easeOutCubic(Math.min(1,t/9));
          camera.position.lerpVectors(new THREE.Vector3(40,25,50),new THREE.Vector3(3.5,2.5,6),p);
        }

        const introFadeIn=smoothstep(0.1,1.4,t);
        const introFadeOut=1-smoothstep(3.4,5.0,t);
        const strength=introFadeIn*introFadeOut;
        hyperspaceGroup.visible=strength>0.005;
        hyperspaceGroup.rotation.z=t*0.55;
        hyperspaceSpeed += ((strength>0.55?1.65:0.2)-hyperspaceSpeed)*0.025;
        hyperspaceRings.forEach((ring,i)=>{
          ring.position.z += hyperspaceSpeed;
          ring.rotation.z += 0.012+(i%3)*0.004;
          ring.material.opacity = strength*strength*(0.5+(i%3)*0.18);
          if(ring.position.z>-8){
            ring.position.z=-150;
            ring.rotation.z=Math.random()*Math.PI*2;
          }
        });

        if(t>=4.8 && !passcodeTriggered) {
          passcodeTriggered = true;
          canvas.style.display = 'none';
          passcodeScreen.classList.add('active');
          init2DCanvas();
        }
      }
      renderer.render(scene,camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>

  <!-- LOGIC MẬT MÃ KHÓA & THIỆP -->
  <script>
    const CORRECT_PASSWORD = "0000";

    let currentPasscode = "";
    const dots = document.querySelectorAll(".dot");
    const messageEl = document.getElementById("passcode-message");
    const cardEl = document.getElementById("passcode-card");

    function updateDots() {
      dots.forEach((dot, idx) => {
        if (idx < currentPasscode.length) {
          dot.classList.add("active");
        } else {
          dot.classList.remove("active");
        }
      });
    }

    function handleInput(digit) {
      if (currentPasscode.length < 4) {
        currentPasscode += digit;
        updateDots();
        messageEl.textContent = "Đang nhập...";
        if (currentPasscode.length === 4) {
          setTimeout(checkPasscode, 150);
        }
      }
    }

    function clearInput() {
      currentPasscode = "";
      updateDots();
      messageEl.style.color = "#d83a56";
      messageEl.textContent = "Nhập 4 số mật mã nhé!";
      cardEl.classList.remove("shake");
    }

    function checkPasscode() {
      if (currentPasscode === CORRECT_PASSWORD) {
        messageEl.style.color = "#28a745";
        messageEl.textContent = "Chính xác rồi! 💖 Mở quà thôi nào...";
        
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#ff758c', '#ff8fa3', '#ffd6e0']
          });
        }

        setTimeout(() => {
          document.getElementById("passcode-screen").classList.remove("active");
          const cardScreen = document.getElementById("card-screen");
          cardScreen.classList.add("active");
          initRosePageLogic();
        }, 1200);

      } else {
        messageEl.style.color = "#d83a56";
        messageEl.textContent = "Mật mã chưa đúng nè, thử lại nhé! 💗";
        cardEl.classList.remove("shake");
        void cardEl.offsetWidth;
        cardEl.classList.add("shake");

        setTimeout(() => {
          currentPasscode = "";
          updateDots();
        }, 600);
      }
    }

    document.querySelectorAll("[data-num]").forEach(btn => {
      btn.addEventListener("click", () => handleInput(btn.dataset.num));
    });
    document.getElementById("btn-clear").addEventListener("click", clearInput);
    document.getElementById("btn-ok").addEventListener("click", checkPasscode);

    window.addEventListener("keydown", (e) => {
      if (!document.getElementById("passcode-screen").classList.contains("active")) return;
      if (e.key >= "0" && e.key <= "9") {
        handleInput(e.key);
      } else if (e.key === "Backspace") {
        clearInput();
      } else if (e.key === "Enter") {
        checkPasscode();
      }
    });

    function init2DCanvas() {
      const c = document.getElementById('bg-canvas-2d');
      const ctx = c.getContext('2d');
      let w = c.width = window.innerWidth;
      let h = c.height = window.innerHeight;

      let pts = [];
      for(let i=0; i<20; i++) {
        pts.push({
          x: Math.random()*w, y: Math.random()*h,
          sz: Math.random()*12+8, spd: Math.random()*0.6+0.3,
          clr: ['#ff758c', '#ff8fa3', '#ffccd5'][Math.floor(Math.random()*3)]
        });
      }

      function draw() {
        ctx.clearRect(0,0,w,h);
        pts.forEach(p => {
          p.y -= p.spd;
          if(p.y < -20) p.y = h+20;
          ctx.fillStyle = p.clr;
          ctx.globalAlpha = 0.4;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.sz/2, 0, Math.PI*2);
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    function initRosePageLogic() {
      setTimeout(() => {
        document.querySelector("#text-click").style.display = "block";
      }, 3500);

      let rid = null;
      const SVG_NS = "http://www.w3.org/2000/svg";
      const shape = document.getElementById("shape");
      const partialPath = document.getElementById("partialPath");
      const pathlength = shape.getTotalLength();

      let t = 0;
      let lengthAtT = pathlength * t;
      let d = shape.getAttribute("d");
      let n = d.match(/C/gi).length;
      let pos = 0;

      class subPath {
        constructor(d) {
          this.d = d;
          this.get_PointsRy();
          this.previous = subpaths.length > 0 ? subpaths[subpaths.length - 1] : null;
          this.measurePath();
          this.get_M_Point();
          this.get_lastCubicBezier();
        }
        get_PointsRy() {
          this.pointsRy = [];
          let temp = this.d.split(/[A-Z,a-z\s,]/).filter(v => v);
          temp.map(item => this.pointsRy.push(parseFloat(item)));
        }
        measurePath() {
          let path = document.createElementNS(SVG_NS, "path");
          path.setAttributeNS(null, "d", this.d);
          this.pathLength = path.getTotalLength();
        }
        get_M_Point() {
          if (this.previous) {
            let p = this.previous.pointsRy;
            let l = p.length;
            this.M_point = [p[l - 2], p[l - 1]];
          } else {
            let p = this.pointsRy;
            this.M_point = [p[0], p[1]];
          }
        }
        get_lastCubicBezier() {
          let lastIndexOfC = this.d.lastIndexOf("C");
          let temp = this.d.substring(lastIndexOfC + 1).split(/[\s,]/).filter(v => v);
          let _temp = [];
          temp.map(item => _temp.push(parseFloat(item)));
          this.lastCubicBezier = [this.M_point];
          for (let i = 0; i < _temp.length; i += 2) {
            this.lastCubicBezier.push(_temp.slice(i, i + 2));
          }
        }
      }

      let subpaths = [];
      for (let i = 0; i < n; i++) {
        let newpos = d.indexOf("C", pos + 1);
        if (i > 0) subpaths.push(new subPath(d.substring(0, newpos)));
        pos = newpos;
      }
      subpaths.push(new subPath(d));

      let index;
      for (index = 0; index < subpaths.length; index++) {
        if (subpaths[index].pathLength >= lengthAtT) break;
      }

      function get_T(t, index) {
        if (index > 0) {
          return (lengthAtT - subpaths[index].previous.pathLength) / (subpaths[index].pathLength - subpaths[index].previous.pathLength);
        }
        return lengthAtT / subpaths[index].pathLength;
      }

      function getBezierPoints(t, points) {
        let helperPoints = [];
        for (let i = 1; i < 4; i++) helperPoints.push(lerp(points[i - 1], points[i], t));
        helperPoints.push(lerp(helperPoints[0], helperPoints[1], t));
        helperPoints.push(lerp(helperPoints[1], helperPoints[2], t));
        helperPoints.push(lerp(helperPoints[3], helperPoints[4], t));
        return [points[0], helperPoints[0], helperPoints[3], helperPoints[5]];
      }

      function lerp(A, B, t) {
        return [(B[0] - A[0]) * t + A[0], (B[1] - A[1]) * t + A[1]];
      }

      function drawCBezier(points, path, index) {
        let d = index > 0 ? subpaths[index].previous.d : `M${points[0][0]},${points[0][1]} C`;
        for (let i = 1; i < 4; i++) d += ` ${points[i][0]},${points[i][1]} `;
        partialPath.setAttributeNS(null, "d", d);
      }

      document.querySelector("#rose-t").onclick = function () {
        document.querySelector("#rose-t").style.display = "none";
        document.querySelector("#castle").style.display = "flex";
        document.querySelector("#theSvg").style.display = "inherit";

        rid = window.requestAnimationFrame(Typing);
        function Typing() {
          rid = window.requestAnimationFrame(Typing);
          if (t >= 1) {
            window.cancelAnimationFrame(rid);
            rid = null;
          } else {
            t += 0.0025;
          }
          lengthAtT = pathlength * t;
          for (index = 0; index < subpaths.length; index++) {
            if (subpaths[index].pathLength >= lengthAtT) break;
          }
          let T = get_T(t, index);
          let newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);
          drawCBezier(newPoints, partialPath, index);
        }
      };

      const leafOne = document.querySelector('.leafOne');
      const stickLine = document.querySelector('.stickLine');
      const leafTwo = document.querySelector('.leafTwo');
      const leafS1 = document.querySelector('.leafS1');
      const rose1 = document.querySelector('.rose1');
      const rose2 = document.querySelector('.rose2');
      const rose3 = document.querySelector('.rose3');
      const rose4 = document.querySelector('.rose4');

      anime({
        targets: [leafOne, stickLine, leafTwo, leafS1, rose1, rose2, rose3, rose4],
        strokeDashoffset: [anime.setDashoffset, 0],
        easing: 'easeInOutCubic',
        duration: 4000,
        begin: function () {
          [leafOne, leafTwo, stickLine, leafS1, rose1, rose2, rose3, rose4].forEach(el => {
            el.setAttribute("stroke", "black");
            el.setAttribute("fill", "none");
          });
        },
        complete: function () {
          leafOne.setAttribute("fill", "#9CDD05");
          leafTwo.setAttribute("fill", "#9CDD05");
          stickLine.setAttribute("fill", "#83AA2E");
          leafS1.setAttribute("fill", "#9CDD05");
          rose1.setAttribute("fill", "#F37D79");
          rose2.setAttribute("fill", "#D86666");
          rose3.setAttribute("fill", "#F37D79");
          rose4.setAttribute("fill", "#D86666");
          [leafOne, leafTwo, stickLine, leafS1, rose1, rose2, rose3, rose4].forEach(el => el.setAttribute("stroke", "none"));
        },
        autoplay: true,
      });

      let indexTextContent = 0;
      let textLetterContent = document.querySelector('.contentLetter');
      const textLetterP = "Nhân ngày 20/10, chúc em yêu luôn luôn xinh đẹp, rạng rỡ và tràn đầy hạnh phúc. Cảm ơn em đã xuất hiện và mang đến cho anh thật nhiều niềm vui.Mong em mỗi ngày đều mỉm cười thật tươi, và hãy nhớ là lúc nào cũng có anh ở đây thương em, đồng hành cùng em nhé. Happy Women's Day! 💕✨";

      function textCharLetterContent() {
        if (indexTextContent < textLetterP.length) {
          textLetterContent.textContent += textLetterP[indexTextContent];
          indexTextContent++;
          setTimeout(textCharLetterContent, 30);
        }
      }

      $('.valentines').hover(function () {$('.card-inner').stop().animate({ top: '-90px' }, 'slow');
      }, function () {
        $('.card-inner').stop().animate({ top: '5px' }, 'slow');
      });

      $('#open-card-btn, .valentines').click(function (e) {
        e.stopPropagation();
        $("#letter-modal").fadeIn();
        indexTextContent = 0;
        textLetterContent.textContent = '';
        textCharLetterContent();
      });

      // Đóng thư khi bấm vào dấu X hoặc bấm ra vùng nền tối bên ngoài (`#modal-bg-close`)
      $('#close-letter, #modal-bg-close').click(function (e) {
        if (e.target === this) {
          $('#letter-modal').fadeOut();
        }
      });
    }
  </script>
</body>
